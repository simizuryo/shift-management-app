# PostgreSQL. 接続先は環境変数で指定する。
#
# ローカル: compose.yaml の db コンテナ(DB_HOST=db)につなぐ
# 本番: RDS につなぐ(DB_HOST / DB_USERNAME / DB_PASSWORD / DB_NAME を指定する)
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV["DB_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: shift_management_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: shift_management_test

# RDS はSSL接続を強制しているため、本番は既定で sslmode=require にする
production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "shift_management_production") %>
  sslmode: <%= ENV.fetch("DB_SSLMODE", "require") %>
