# EC2 上の nginx(web コンテナ)の設定。
# /api/* は Rails(backend コンテナ)に、それ以外は Next.js(frontend コンテナ)に転送する。
# 画面の /shifts/new などと API の /shifts/:id のパスが重なるため、API には /api を付けて区別する。

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Docker の内部 DNS。コンテナが再起動して IP が変わっても、転送先を引き直せるようにする
    resolver 127.0.0.11 valid=10s;
    set $backend  http://backend:3000;
    set $frontend http://frontend:3000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/shifts → Rails の /shifts
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
    }
}
